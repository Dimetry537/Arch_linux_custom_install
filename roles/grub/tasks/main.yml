- name: Установить grub и efibootmgr
  pacman:
    name:
      - grub
      - efibootmgr
    state: present

- name: Установить GRUB (UEFI)
  command: >
    grub-install
    --target=x86_64-efi
    --efi-directory=/boot
    --bootloader-id=GRUB

- name: Скрыть меню GRUB
  lineinfile:
    path: /etc/default/grub
    regexp: "^GRUB_TIMEOUT="
    line: "GRUB_TIMEOUT=0"

- name: Установить стиль скрытого меню GRUB
  lineinfile:
    path: /etc/default/grub
    regexp: "^GRUB_TIMEOUT_STYLE="
    line: "GRUB_TIMEOUT_STYLE=hidden"
    insertafter: EOF

- name: Сгенерировать конфигурацию GRUB
  command: grub-mkconfig -o /boot/grub/grub.cfg
