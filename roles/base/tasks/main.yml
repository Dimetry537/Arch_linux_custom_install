- name: Установить hostname
  copy:
    dest: /etc/hostname
    content: "{{ hostname }}\n"

- name: Настроить /etc/hosts
  copy:
    dest: /etc/hosts
    content: |
      127.0.0.1   localhost
      ::1         localhost
      127.0.1.1   {{ hostname }}.localdomain {{ hostname }}

- name: Настроить часовой пояс
  file:
    src: "/usr/share/zoneinfo/{{ timezone }}"
    dest: /etc/localtime
    state: link
    force: true

- name: Синхронизировать hardware clock
  command: hwclock --systohc

- name: Включить локали
  lineinfile:
    path: /etc/locale.gen
    regexp: '^#?{{ item }}'
    line: '{{ item }}'
  loop:
    - en_US.UTF-8 UTF-8
    - ru_RU.UTF-8 UTF-8

- name: Сгенерировать локали
  command: locale-gen

- name: Установить LANG
  copy:
    dest: /etc/locale.conf
    content: "LANG=en_US.UTF-8\n"

